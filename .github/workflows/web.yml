name: GitHub Pages redirect

# The browser version and the homepage live on https://slide-station.sams.land now (site/, on
# Railway). This publishes a page at the old GitHub Pages address that sends visitors there:
# /slide-station/ → the homepage. Run it once by hand; nothing else changes on Pages.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Redirect page
        run: |
          mkdir out
          cat > out/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Slide Station has moved</title>
          <link rel="canonical" href="https://slide-station.sams.land/">
          <meta http-equiv="refresh" content="0; url=https://slide-station.sams.land/">
          <p>Slide Station lives at <a href="https://slide-station.sams.land/">slide-station.sams.land</a> now.
          HTML
          cp out/index.html out/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
