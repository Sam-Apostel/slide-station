[project]
name = "slidestation"
version = "1.0.0"
description = "Import, restore and upload Kodak Slide N Scan scans to Immich"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "pillow>=10.0",
]

[tool.uv]
package = false

[dependency-groups]
# tests: uv run --python 3.12 pytest tests  (python-multipart: the mock Immich reads uploads)
dev = ["pytest>=8", "python-multipart>=0.0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
