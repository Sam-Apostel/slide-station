# XcodeGen spec for the native app. Generate the project with:  cd apple && xcodegen
# (SlideStation.xcodeproj is generated, not committed.)
name: SlideStation
options:
  bundleIdPrefix: dev.slidestation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ProUI:
    path: Vendor/ProUI
  SlideKit:
    path: SlideKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    # For a device build: export DEVELOPMENT_TEAM=<your team id> before running xcodegen.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  SlideStation:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: ProUI
      - package: SlideKit
    settings:
      base:
        PRODUCT_NAME: Slide Station
        PRODUCT_BUNDLE_IDENTIFIER: dev.slidestation.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Slide Station
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        # the Immich server is usually on the LAN or a tailnet, often plain http
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Slide Station uploads your slides to your Immich server.
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
    info:
      path: App/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: false
        ITSAppUsesNonExemptEncryption: false
schemes:
  SlideStation:
    build:
      targets:
        SlideStation: all
    run:
      config: Debug
    test:
      config: Debug
